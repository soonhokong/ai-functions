name: Test and Lint

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir hatch

      - name: Run lint
        run: hatch run lint

      - name: Run tests
        run: hatch run test

  verified-compile-native:
    name: Verified Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e . pytest pytest-asyncio

      - name: Run Lean-to-native integration tests
        env:
          AI_FUNCTIONS_LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
          AI_FUNCTIONS_LEAN_TOOLCHAIN_MODE: managed
          AI_FUNCTIONS_RUN_LEAN_TESTS: '1'
          AI_FUNCTIONS_VERIFIED_COMPILE_TEST_CACHE: ${{ runner.temp }}/ai-functions-verified-compile
        run: pytest -q tests/test_verified_compile_native.py
